<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker Kuliah v2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        
        <!-- Header Aplikasi -->
        <header class="app-header">
            <span class="app-icon">📋</span>
            <h1>Task Tracker Kuliah <small>v2 · REST API</small></h1>
        </header>

        <!-- Form Tambah Tugas -->
        <form id="task-form" class="task-form">
            <div class="input-group">
                <input 
                    type="text" 
                    id="task-title" 
                    placeholder="Judul tugas (min. 3 karakter)" 
                    autocomplete="off"
                >
            </div>
            
            <div class="form-row">
                <div class="select-wrapper">
                    <select id="task-matkul">
                        <!-- Opsi diisi dinamis via GET /api/matkul -->
                        <option value="">Memuat matkul...</option>
                    </select>
                </div>
                <div class="date-wrapper">
                    <input type="date" id="task-deadline">
                </div>
                <button type="submit" class="btn-submit">Tambah</button>
            </div>
            
            <!-- Area Pesan Error -->
            <div id="error-message" class="error-message hidden"></div>
        </form>

        <!-- Fitur Pencarian (Bonus Debounce) -->
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="🔍 Cari tugas..." autocomplete="off">
        </div>

        <!-- Filter & Counter Bar -->
        <div class="filter-bar">
            <div class="filters">
                <button type="button" class="filter-btn on" data-filter="semua">Semua</button>
                <button type="button" class="filter-btn" data-filter="aktif">Aktif</button>
                <button type="button" class="filter-btn" data-filter="selesai">Selesai</button>
            </div>
            <div id="task-counter" class="task-counter">0 tugas aktif</div>
        </div>

        <!-- Daftar Tugas -->
        <ul id="task-list" class="task-list">
            <li class="empty-state">Memuat tugas...</li>
        </ul>

    </div>

    <!-- PENTING: Muat mock-api.js sebelum app.js -->
    <script src="mock-api.js"></script>
    <script src="app.js" defer></script>
</body>
</html>
